<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Order Confirmed | StockFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="management-page order-page">

<main class="dashboard-wrapper">
    <section class="mac-window management-window">

        <header class="mac-toolbar">
            <div class="window-controls">
                <span class="control close-control"></span>
                <span class="control minimise-control"></span>
                <span class="control maximise-control"></span>
            </div>

            <a class="dashboard-logo" th:href="@{/}">
                <span class="logo-icon">
                    <i class="bi bi-box-seam"></i>
                </span>
                <span>StockFlow</span>
            </a>

            <nav class="dashboard-nav">
                <a class="nav-pill" th:href="@{/}">Dashboard</a>
                <a class="nav-pill" th:href="@{/catalog}">Catalogue</a>
                <a class="nav-pill active" th:href="@{/orders}">
                    My Orders
                </a>
            </nav>

            <a class="toolbar-button"
               th:href="@{/}"
               title="Dashboard">
                <i class="bi bi-house"></i>
            </a>
        </header>

        <div class="dashboard-content success-content">

            <section class="order-success-card">

                <div class="success-animation">
                    <span class="success-circle">
                        <i class="bi bi-check-lg"></i>
                    </span>
                </div>

                <p class="eyebrow">TRANSACTION COMPLETED</p>
                <h1>Order Confirmed</h1>

                <p class="success-message">
                    Your order has been processed and the inventory
                    stock has been updated successfully.
                </p>

                <div class="success-reference">
                    <small>Order Reference</small>

                    <strong th:text="${order.orderNumber}">
                        ORD-00000000
                    </strong>
                </div>

                <div class="success-summary">
                    <div>
                        <span>Product</span>
                        <strong th:text="${order.product.name}">
                            Product
                        </strong>
                    </div>

                    <div>
                        <span>Quantity</span>
                        <strong th:text="${order.quantity}">
                            1
                        </strong>
                    </div>

                    <div>
                        <span>Total</span>
                        <strong th:text="'Rs. ' + ${#numbers.formatDecimal(order.totalPrice, 1, 2)}">
                            Rs. 0.00
                        </strong>
                    </div>

                    <div>
                        <span>Status</span>
                        <strong class="confirmed-status">
                            <i class="bi bi-check-circle-fill"></i>
                            Confirmed
                        </strong>
                    </div>
                </div>

                <div class="success-actions">
                    <a th:href="@{/orders}"
                       class="modern-primary-button">
                        <i class="bi bi-receipt"></i>
                        View My Orders
                    </a>

                    <a th:href="@{/catalog}"
                       class="modern-secondary-button">
                        Continue Browsing
                    </a>
                </div>
            </section>
        </div>
    </section>
</main>

</body>
</html>
